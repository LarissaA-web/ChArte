<a [routerLink]="['/categoria', categoria]" class="card" [attr.aria-label]="'Ver pins de ' + categoria">
  <img class="card-image" [src]="imagemCategoria" alt="" loading="lazy" />
  <span class="card-abbreviation" aria-hidden="true">{{ abreviacao }}</span>
  <span class="card-category">{{ categoria }}</span>
</a>
