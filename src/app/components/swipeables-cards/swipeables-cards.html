<div class="swipeablesCards">
  @if (erroCategorias) { <p role="alert">{{ erroCategorias }}</p> }
  @for (categoria of categorias; track categoria.id_categoria) {
    <app-card [categoria]="categoria.nome_categoria"> </app-card>
  }
</div>

<div class="catalogueSelector">
  @if (erroEstilos) { <p role="alert">{{ erroEstilos }}</p> }
  @for (estilo of estilos; track estilo.id_estilo) {
    <app-card-sm [imagem]="imagemDoEstilo(estilo)" [estilo]="estilo.nome_estilo"> </app-card-sm>
  }
</div>
